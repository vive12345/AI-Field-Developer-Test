[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gateway"
version = "0.1.0"
description = "HTTP/JSON-RPC security gateway that enforces role-based tool access for MCP servers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"
mock-mcp-server = "mock_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway", "src/mock_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
