[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-router"
version = "0.1.0"
description = "LLM gateway router with a token-aware SQLite rate limiter and model failover."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llm-router = "llm_router.__main__:main"
mock-provider = "mock_providers.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router", "src/mock_providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
