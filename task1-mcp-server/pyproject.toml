[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-mcp"
version = "0.1.0"
description = "MCP server exposing customer lookup and refund tools over stdio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
customer-mcp = "customer_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
