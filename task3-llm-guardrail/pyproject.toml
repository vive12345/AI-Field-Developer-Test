[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-guardrail"
version = "0.1.0"
description = "LLM gateway that redacts PII from streaming responses in real time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "regex>=2024.4.16",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llm-gateway = "llm_gateway.__main__:main"
mock-llm-provider = "mock_llm_provider.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway", "src/mock_llm_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
